<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/book.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <title>BooksCatalogue</title>
  </head>
  <body>
    <header>
      <div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 7V21" stroke="oklch(60.5% 0.144 36.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 18C2.73478 18 2.48043 17.8946 2.29289 17.7071C2.10536 17.5196 2 17.2652 2 17V4C2 3.73478 2.10536 3.48043 2.29289 3.29289C2.48043 3.10536 2.73478 3 3 3H8C9.06087 3 10.0783 3.42143 10.8284 4.17157C11.5786 4.92172 12 5.93913 12 7C12 5.93913 12.4214 4.92172 13.1716 4.17157C13.9217 3.42143 14.9391 3 16 3H21C21.2652 3 21.5196 3.10536 21.7071 3.29289C21.8946 3.48043 22 3.73478 22 4V17C22 17.2652 21.8946 17.5196 21.7071 17.7071C21.5196 17.8946 21.2652 18 21 18H15C14.2044 18 13.4413 18.3161 12.8787 18.8787C12.3161 19.4413 12 20.2044 12 21C12 20.2044 11.6839 19.4413 11.1213 18.8787C10.5587 18.3161 9.79565 18 9 18H3Z" stroke="oklch(60.5% 0.144 36.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h4>bookcatalog</h4>
      </div>
      <div>
        <label class="theme-toggle-lable" for="theme-toggle">
            <img src="./src/assets/moon.svg" alt="moon icon">
            <input type="checkbox" id="theme-toggle" >
        </label>
      </div>
    </header>
    <main>
      <section>
       <div id="hero-section">
        <h1>The Home of the greatest books</h1>
        <h4>Your one-stop shop for all your reading needs</h4>
       </div>
       <div id="input-container" class="">
        <input type="text" id="search-input" class="" placeholder="Search for books...">
        <button id="search-button">
          <span class="search-word">Search</span>
          <img src="./src/assets/search.svg" alt="search icon" class="search-img">
        </button>
       </div>
       <button id="filter-button" popovertarget="filterpop-up">Filter By Author</button>
      </section>
      <div id="filterpop-up" popover="auto">
             <label>Author is ?</label>
             <input id="filterInput" type="text" placeholder="authors name">
             <button id="filtersearch" popovertarget="filterpop-up" popovertargetaction="hide">Save</button>
      </div>
      <section id="content-container">
        <section id="content">
          <div id="loader">
            <div class="size-10 border">
              <svg fill="oklch(60.5% 0.144 36.5)" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="4" cy="12" r="3"><animate id="spinner_jObz" begin="0;spinner_vwSQ.end-0.25s" attributeName="r" dur="0.75s" values="3;.2;3"/></circle><circle cx="12" cy="12" r="3"><animate begin="spinner_jObz.end-0.6s" attributeName="r" dur="0.75s" values="3;.2;3"/></circle><circle cx="20" cy="12" r="3"><animate id="spinner_vwSQ" begin="spinner_jObz.end-0.45s" attributeName="r" dur="0.75s" values="3;.2;3"/></circle></svg>
            </div>
          </div>
          <article id="placeholder">
             <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 7V21" stroke="oklch(60.5% 0.144 36.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 18C2.73478 18 2.48043 17.8946 2.29289 17.7071C2.10536 17.5196 2 17.2652 2 17V4C2 3.73478 2.10536 3.48043 2.29289 3.29289C2.48043 3.10536 2.73478 3 3 3H8C9.06087 3 10.0783 3.42143 10.8284 4.17157C11.5786 4.92172 12 5.93913 12 7C12 5.93913 12.4214 4.92172 13.1716 4.17157C13.9217 3.42143 14.9391 3 16 3H21C21.2652 3 21.5196 3.10536 21.7071 3.29289C21.8946 3.48043 22 3.73478 22 4V17C22 17.2652 21.8946 17.5196 21.7071 17.7071C21.5196 17.8946 21.2652 18 21 18H15C14.2044 18 13.4413 18.3161 12.8787 18.8787C12.3161 19.4413 12 20.2044 12 21C12 20.2044 11.6839 19.4413 11.1213 18.8787C10.5587 18.3161 9.79565 18 9 18H3Z" stroke="oklch(60.5% 0.144 36.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>
            <h4 >Bookcatalog</h4>
            <h3>Enter Query to search the catalogue</h3>
          </article>
        </section>
        <aside>
          <details open="true">
            <summary>Favourites</summary>
            <ul id="favourites">
            </ul>
          </details>
        </aside>
      </section>
    </main>
    <footer class="border object-cover">
      <p>Copyright &copy; 2026</p>
    </footer>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
